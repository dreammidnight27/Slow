<!doctype html>
<!--
	Slow, as one file. Open it in a browser (like Chrome) and Slow fills the window.

	Slow's browsing runs in a service worker, and browsers only run those from a separate .js
	file on a real website, never from a file opened on its own. So this file opens Slow from
	its GitHub Pages site, which has to be reachable. To point it at another copy of Slow,
	change the iframe's src below.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>Slow</title>
		<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='377%20270%20136%20136'%3E%3Ccircle%20cx='445'%20cy='338'%20r='60'%20fill='%232a1757'/%3E%3Cg%20fill='none'%20stroke='%23c4a3ff'%20stroke-width='10'%20stroke-linecap='round'%3E%3Ccircle%20cx='445'%20cy='338'%20r='60'/%3E%3Cellipse%20cx='445'%20cy='338'%20rx='26'%20ry='60'/%3E%3Cline%20x1='385'%20y1='338'%20x2='505'%20y2='338'/%3E%3Cline%20x1='394'%20y1='308'%20x2='496'%20y2='308'/%3E%3Cline%20x1='394'%20y1='368'%20x2='496'%20y2='368'/%3E%3C/g%3E%3C/svg%3E" />
		<style>
			:root {
				color-scheme: light;
				--surface: #f3eeff;
				--glow: #dccbff;
				--ink: #2a1763;
				--accent: #5a33b0;
				--on-accent: #ffffff;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					color-scheme: dark;
					--surface: #050309;
					--glow: #2a1763;
					--ink: #f3eeff;
					--accent: #c4a3ff;
					--on-accent: #1d0f45;
				}
			}
			html,
			body {
				height: 100%;
				margin: 0;
			}
			body {
				overflow: hidden;
				background: var(--surface);
			}
			/* Slow itself, filling the whole window */
			#slow {
				position: fixed;
				inset: 0;
				width: 100%;
				height: 100%;
				border: 0;
				display: block;
			}
			/* Shown while Slow opens. Only when scripts run, so it can never get stuck on top. */
			#cover {
				display: none;
			}
			.js #cover {
				position: fixed;
				inset: 0;
				z-index: 1;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 20px;
				padding: 24px;
				text-align: center;
				color: var(--ink);
				background: radial-gradient(120% 75% at 50% 0%, var(--glow), var(--surface) 72%);
				font: 1.0625rem/1.5 "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
				transition: opacity 0.4s ease, visibility 0.4s;
			}
			.js #cover.gone {
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
			}
			#cover svg {
				width: 72px;
				height: 72px;
				animation: breathe 2.4s ease-in-out infinite;
			}
			#status {
				margin: 0;
				max-width: 30ch;
			}
			#retry {
				font: inherit;
				font-weight: 600;
				color: var(--on-accent);
				background: var(--accent);
				border: 0;
				border-radius: 999px;
				padding: 10px 24px;
				cursor: pointer;
			}
			#retry:focus-visible {
				outline: 3px solid var(--ink);
				outline-offset: 3px;
			}
			#retry[hidden] {
				display: none;
			}
			@keyframes breathe {
				50% {
					transform: scale(0.92);
					opacity: 0.7;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#cover svg,
				.js #cover {
					animation: none;
					transition: none;
				}
			}
		</style>
		<script>
			document.documentElement.classList.add("js");
		</script>
	</head>

	<body>
		<iframe
			id="slow"
			src="https://dreammidnight27.github.io/Slow/"
			title="Slow"
			allow="fullscreen; autoplay; clipboard-read; clipboard-write; camera; microphone; display-capture; encrypted-media; picture-in-picture; screen-wake-lock; gamepad; geolocation; web-share; accelerometer; gyroscope; midi; xr-spatial-tracking; storage-access"
			allowfullscreen
		></iframe>

		<div id="cover">
			<svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="377 270 136 136"><circle cx="445" cy="338" r="60" fill="#2a1757"/><g fill="none" stroke="#c4a3ff" stroke-width="10" stroke-linecap="round"><circle cx="445" cy="338" r="60"/><ellipse cx="445" cy="338" rx="26" ry="60"/><line x1="385" y1="338" x2="505" y2="338"/><line x1="394" y1="308" x2="496" y2="308"/><line x1="394" y1="368" x2="496" y2="368"/></g></svg>
			<p id="status" role="status">Opening Slow…</p>
			<button id="retry" type="button" hidden>Try again</button>
		</div>

		<script>
			(() => {
				const frame = document.getElementById("slow");
				const cover = document.getElementById("cover");
				const status = document.getElementById("status");
				const retry = document.getElementById("retry");
				const SLOW = frame.src;
				let loaded = false;
				let slowTimer;

				const show = (message, canRetry) => {
					status.textContent = message;
					retry.hidden = !canRetry;
					cover.classList.remove("gone");
				};
				// Focusing Slow's window (not just its frame) is what lets Slow's keyboard shortcuts work
				const focusSlow = () => frame.contentWindow?.focus();
				const offline = () => show("You’re offline. Slow will open when you’re back online.", true);
				const waitForSlow = () => {
					clearTimeout(slowTimer);
					slowTimer = setTimeout(() => show("Slow is taking longer than usual to open.", true), 15000);
				};
				const open = () => {
					if (!navigator.onLine) return offline();
					show("Opening Slow…", false);
					waitForSlow();
					frame.src = SLOW;
				};

				frame.addEventListener("load", () => {
					// Offline, what loaded is the browser’s error page, so the message stays on top.
					if (!navigator.onLine) return offline();
					loaded = true;
					clearTimeout(slowTimer);
					cover.classList.add("gone");
					focusSlow();
				});
				retry.addEventListener("click", open);
				// (only before Slow has opened: reloading later would close everyone’s tabs)
				addEventListener("online", () => loaded || open());
				addEventListener("focus", focusSlow);

				// The frame is already loading on its own; this only sets up the messages.
				if (navigator.onLine) waitForSlow();
				else offline();
			})();
		</script>
	</body>
</html>
